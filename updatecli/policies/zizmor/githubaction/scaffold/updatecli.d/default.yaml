name: Install Zizmor GitHub action workflow
pipelineid: "{{ .pipelineid }}"

sources:
  zizmor-action:
    kind: githubrelease
    name: Get latest zizmor github action
    spec:
      owner: zizmorcore
      repository: zizmor-action
      versionfilter:
        kind: semver

  zizmor-action-digest:
    dependson:
      - zizmor-action
    name: Get latest GitHub Release digest for zizmorcore/zizmor-action
    kind: githubrelease
    spec:
      key: taghash
      owner: zizmorcore
      repository: zizmor-action
      versionfilter:
        kind: regex
        pattern: '{{ source "zizmor-action" }}'

  checkout-action:
    name: Get latest checkout github action
    kind: githubrelease
    spec:
      owner: actions
      repository: checkout
      versionfilter:
        kind: semver

  checkout-action-digest:
    dependson:
      - checkout-action
    name: Get latest GitHub Release digest for actions/checkout
    kind: githubrelease
    spec:
      key: taghash
      owner: actions
      repository: checkout
      versionfilter:
        kind: semver
        pattern: '{{ source "checkout-action" }}'

targets:
  workflow:
    name: 'install Zizmor gha action {{ source "zizmor-action" }}'
    kind: file
    disablesourceinput: true
    # {{ if .scm.enabled }}
    scmid: default
    # {{ end }}
    spec:
      file: ".github/workflows/zizmor.yaml"
      forcecreate: true
      template: "{{ .gha.template_path }}"
      templatedata:
        checkoutActionVersion: '{{ source "checkout-action" }}'
        checkoutActionDigest: '{{ source "checkout-action-digest" }}'
        zizmorActionVersion: '{{ source "zizmor-action" }}'
        zizmorActionDigest: '{{ source "zizmor-action-digest" }}'
        advancedSecurity: "{{ .gha.advanced_security }}"
        private: {{ .gha.private }}

  # {{ if  .config }}
  config:
    name: "install zizmor configuration file"
    kind: file
    disablesourceinput: true
    # {{ if .scm.enabled }}
    scmid: default
    # {{ end }}
    spec:
      file: ".github/zizmor.yaml"
      forcecreate: true
      content: |
        {{ toYaml .config | nindent 8 }}
  # {{ end }}
  # {{ if .autofix.enabled }}
  autofix:
    name: "fix zizmor findings ({{ .autofix.mode }} mode)"
    kind: shell
    disablesourceinput: true
    # The zizmor workflow must be committed first, otherwise it shows up in the
    # list of files fixed by this target.
    dependson:
      - workflow
    # {{ if .scm.enabled }}
    scmid: default
    # {{ end }}
    spec:
      # zizmor reports on stderr so that stdout only carries the list of modified
      # files: with the console/output detection below, an empty stdout means that
      # there was nothing to fix.
      command: |
        command -v zizmor >/dev/null 2>&1 || { echo "zizmor CLI not found in PATH" >&2; exit 1; }
        zizmor --fix={{ .autofix.mode }} --no-exit-codes {{ .autofix.inputs }} >&2
        git diff --name-only
      environments:
        - name: PATH
        - name: HOME
        - name: "{{ .autofix.env_token }}"
      changedif:
        kind: console/output
  # {{ end }}
