# NOTE: This file is a scaffold template for default values.
# These values are used by updatecli when rendering the policy manifest.
# Edit to match your repository or provide overrides at runtime with --values.

scm:
  # Enable or disable SCM integration for this policy.
  # When disabled, Updatecli will not open PRs or push changes.
  enabled: false

  # SCM provider kind (supported: github, githubsearch, gitea).
  # Use lowercase values.
  #
  # gitea requires `url` below (for example https://codeberg.org) and an
  # `env_token` pointing at a Gitea token, usually GITEA_TOKEN. The Gitea pull
  # request action ignores labels, automerge, mergemethod and parent.
  kind: github

  # Gitea instance URL. Required when kind is gitea, unused otherwise.
  # url: "https://codeberg.org"

  # Token lookup: by default Updatecli reads the token from the named
  # environment variable. Set this to the env var name (e.g. GITHUB_TOKEN).
  # Alternatively, you may set `token` below to provide a literal token
  # (not recommended for checked-in files).
  env_token: GITHUB_TOKEN

  # Optional: provide a literal token here (overrides env_token). Avoid committing secrets.
  # token: "ghp_xxx"

  # Repository settings (recommended to fill for CI / automation):
  # owner: my-org-or-user
  # repository: my-repo
  # username: updatecli-bot
  # user: updatecli-bot
  # email: updatecli-bot@example.com
  # branch: main

  commitusingapi: true

  limit: 3
  # depth controls how many commits are fetched when Updatecli interacts with the SCM. A lower depth can speed up operations but may limit the ability to access historical commit.
  # Adjust based on your needs. Default shallow clone disabled.
  depth: 0
  commitmessage:
    type: "chore"
    scope: "updatecli"
    #footers: "Signed-off-by: updateclibot <bot@updatecli.io>"
# Example: to disable SCM during local dry-runs, set `scm.enabled: false`.
#

pipelineid: scaffold_updatecli
automerge: false
# Parent is a boolean that controls whether the generated PR should target the parent of the repository or the repository itself.
# This is useful when the repository is a fork and you want to target the upstream repository instead of the fork.
# Default is false, meaning the PR will target the repository itself.
parent: false
labels:
  - "chore"

description: |+
  This PR was automatically created by Updatecli to set up the Updatecli GitHub Action workflows.  

  Updatecli is a tool to automate configuration update across git repositories.  
  These workflows run Updatecli on a schedule, and in dry-run mode on every pull request.  

  For more information:  

    * [Updatecli GitHub Action](https://github.com/updatecli/updatecli-action)  

    * [Updatecli Policies](https://github.com/updatecli/policies/tree/main/updatecli/policies/updatecli/githubaction/scaffold)  


gha:
  # workflow_dir is the directory the workflows are written to.
  # Gitea Actions reads both .github/workflows and .gitea/workflows; set this to
  # ".gitea/workflows" if you prefer to keep Gitea workflows separate.
  workflow_dir: ".github/workflows"

  # auth defines which credentials the generated apply/update workflows reference.
  #   app   -> UPDATECLI_GITHUB_APP_* built from the UPDATECLIBOT_APP_* repository secrets
  #   token -> UPDATECLI_GITHUB_TOKEN built from the built-in secrets.GITHUB_TOKEN
  #   gitea -> UPDATECLI_GITEA_TOKEN built from the built-in secrets.GITEA_TOKEN
  #
  # NOTE: `app` reproduces the workflows used by the updatecli project itself. The
  # scaffolded workflows will fail until the matching secrets exist in the target
  # repository. Use `token` for a workflow that runs out of the box, keeping in mind
  # that pull requests opened with GITHUB_TOKEN do not trigger other workflows.
  # Use `gitea` when the generated workflows run on Gitea Actions.
  auth: app

  # golang installs an actions/setup-go step in the generated workflows.
  golang:
    enabled: false
    version_file: "go.mod"

  # npm installs an actions/setup-node step in the generated workflows.
  npm:
    enabled: false
    version_file: "package.json"

  # udash renders the UPDATECLI_UDASH_* environment variables in the apply and
  # update workflows, and adds the --experimental flag to their updatecli run
  # (Udash reporting is gated behind it). Only enable it if the target repository
  # has those secrets and an Udash instance to report to.
  udash:
    enabled: false

  # apply installs .github/workflows/updatecli.yaml
  apply:
    enabled: true
    cron: "0 12 */14 * *"
    template_path: "https://raw.githubusercontent.com/updatecli/policies/refs/heads/main/updatecli/policies/updatecli/githubaction/scaffold/assets/gha_updatecli.yaml"

  # test installs .github/workflows/updatecli_test.yaml
  test:
    enabled: true
    template_path: "https://raw.githubusercontent.com/updatecli/policies/refs/heads/main/updatecli/policies/updatecli/githubaction/scaffold/assets/gha_updatecli_test.yaml"

  # update installs .github/workflows/updatecli_update.yaml
  #
  # matrix drives the job matrix of the update workflow. Each entry becomes one
  # `updatecli compose apply` run. The default refreshes pull requests that already
  # exist without ever opening new ones -- opening new pull requests is the job of
  # the apply workflow above.
  #
  # The updatecli project itself adds a second leg restricted to the manifests it
  # labels with `monitor: active`:
  #
  #   - target_name: "monitored pipelines"
  #     apply_args: "--labels=monitor:active"
  #
  # That leg is a no-op in a repository that does not use the `monitor` label.
  update:
    enabled: true
    cron: "0 1 * * *"
    matrix:
      - target_name: "existing pipelines"
        apply_args: "--existing-only=true"
    template_path: "https://raw.githubusercontent.com/updatecli/policies/refs/heads/main/updatecli/policies/updatecli/githubaction/scaffold/assets/gha_updatecli_update.yaml"

pipeline:
  labels:
    ecosystem: "updatecli"
    policy: scaffold
