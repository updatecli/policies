---
name: Updatecli Test
on:
  pull_request:
permissions:
  contents: read
jobs:
  updatecli:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: "actions/checkout@{{ .checkoutActionDigest }}" # {{ .checkoutActionVersion }}
        with:
          persist-credentials: false
      - name: "Setup updatecli"
        uses: "updatecli/updatecli-action@{{ .updatecliActionDigest }}" # {{ .updatecliActionVersion }}
        with:
          version: "{{ .updatecliVersion }}"
{{- if .setupGoActionDigest }}
      - name: "Set up Go"
        uses: "actions/setup-go@{{ .setupGoActionDigest }}" # {{ .setupGoActionVersion }}
        with:
          go-version-file: "{{ .golangVersionFile }}"
          cache: false
        id: go
{{- end }}
{{- if .setupNodeActionDigest }}
      - name: "Set up Node"
        uses: "actions/setup-node@{{ .setupNodeActionDigest }}" # {{ .setupNodeActionVersion }}
        with:
          node-version-file: "{{ .npmVersionFile }}"
          package-manager-cache: false
        id: node
{{- end }}
{{- /*
  Uncurated steps from gha.steps / gha.<workflow>.steps, serialised by the manifest
  and passed through as written. ${__GHA__ is the manifest's placeholder for a
  GitHub Action expression opener, which cannot survive the manifest literally.
*/}}
{{- if .extraSteps }}
{{ .extraSteps | replace "${__GHA__" "${{" | trimSuffix "\n" | indent 6 }}
{{- end }}
      - name: "Test updatecli in dry-run mode"
        run: "updatecli compose diff"
        env:
          # This step is executed in untrusted context. We use a token with minimal permissions.
{{- if .giteaAuth }}
          UPDATECLI_GITEA_TOKEN: {{ "${{ secrets.GITEA_TOKEN }}" }}
{{- else }}
          UPDATECLI_GITHUB_USERNAME: {{ "${{ github.actor }}" }}
          UPDATECLI_GITHUB_TOKEN: {{ "${{ secrets.GITHUB_TOKEN }}" }}
{{- end }}
