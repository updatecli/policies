# NOTE: Files prefixed with an underscore are partial Updatecli configuration
# templates. They are intended to be included into other Updatecli manifests
# and are not full standalone documents unless you explicitly make them so
# (for example by adding a leading `---` and providing all required fields).
#
# The Gitea pull request action does not support labels, automerge, mergemethod
# or parent: those settings are silently ignored for `scm.kind: gitea`.

# {{ if and .scm.enabled ( eq .scm.kind "gitea" ) }}
# {{ $GiteaPAT := env .scm.env_token }}
actions:
  default:
    kind: "gitea/pullrequest"
    spec:
      title: 'install Updatecli gha workflows {{ source "updatecli-version" }}'
      body: "{{ .description }}"
    scmid: "default"

scms:
  default:
    kind: "gitea"
    spec:
      # url is required by the Gitea scm, for example https://codeberg.org
      url: "{{ .scm.url }}"
      # {{ if .scm.user }}
      user: "{{ .scm.user }}"
      # {{ end }}
      # {{ if .scm.email }}
      email: "{{ .scm.email }}"
      # {{ end }}
      owner: "{{ .scm.owner }}"
      repository: "{{ .scm.repository }}"
      token: "{{ default $GiteaPAT .scm.token }}"
      username: "{{ .scm.username }}"
      # {{ if .scm.branch }}
      branch: "{{ .scm.branch }}"
      # {{ end }}
      # {{ if .scm.depth }}
      depth: {{ .scm.depth }}
      # {{ end }}
      commitmessage:
        type: "{{ .scm.commitmessage.type }}"
        scope: "{{ .scm.commitmessage.scope }}"
        # {{ if .scm.commitmessage.footers }}
        footers: "{{ .scm.commitmessage.footers }}"
        # {{ end }}
# {{ end }}
